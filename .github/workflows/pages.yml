# Static demo on GitHub Pages: https://<owner>.github.io/<repo>/
# GitHub Pages only serves files, so this build (NEXT_PUBLIC_STATIC_DEMO=1) pre-renders every page and runs the
# mock API inside the browser (src/lib/demo) with its data in localStorage. The server build (CI) is unaffected.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_PUBLIC_LEGACY_URL: https://rbs-vat.example.com

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requirements.txt }
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build (static export → out/)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:pages
      - name: Smoke test the export (sign-in, create, persist, CSV, 404)
        env:
          PAGES_URL: http://localhost:8080${{ steps.pages.outputs.base_path }}
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/site && cp -r out "/tmp/site${{ steps.pages.outputs.base_path }}"
          (cd /tmp/site && python -m http.server 8080 > /dev/null 2>&1 &)
          sleep 1
          python scripts/pages_smoke.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
