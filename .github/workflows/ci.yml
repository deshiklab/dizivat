# FE-S2-06 / S3 — every push / PR: types, lint rules (S2-08 guards), production build,
# then browser checks against the built app: console-clean capture, visual regression,
# end-to-end flows (Sprints 1–3), API contract, axe (WCAG 2.2 AA, light + dark) and performance budgets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder for the legacy-system button (baked in at build time); the real host is never committed
  NEXT_PUBLIC_LEGACY_URL: https://rbs-vat.example.com

jobs:
  static:
    name: Typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  browser:
    name: E2E · visual · a11y
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://localhost:3000
      SHOT_DIR: ${{ github.workspace }}/test-results/screens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next }
      - name: Install Playwright
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start app (fresh in-memory seed)
        run: |
          npx next start -H 0.0.0.0 -p 3000 > server.log 2>&1 &
          npx --yes wait-on -t 60000 http-get://localhost:3000/en/login
      # Order matters: capture/visual need the untouched seed; e2e scripts mutate the mock DB.
      - name: Capture (fails on any console/page error)
        working-directory: scripts
        run: python capture.py
      # Baselines are captured in the dev container; font rasterisation on the GitHub runner differs by ~2–4 % on
      # every screen (even static ones), so here the comparison is report-only — diffs are in the test-results
      # artifact. Functional regressions are caught by the suites below. Re-baseline: `python visual.py --update`.
      - name: Visual regression (report-only on CI)
        working-directory: scripts
        continue-on-error: true
        run: python visual.py
      - name: E2E — Sprint 1
        working-directory: scripts
        run: python e2e.py
      - name: E2E — Sprint 2 (auth, roles, edit/cancel, parties, ledger, views)
        working-directory: scripts
        run: python e2e_s2.py
      - name: API contract (auth, Page shape, problem+json, 404/409/422) — non-destructive
        working-directory: scripts
        run: python contract.py --doc
      - name: E2E — Sprint 3 (users, forced password, company, tariff, audit, notifications)
        working-directory: scripts
        run: python e2e_s3.py
      - name: E2E — Sprint 4 (units, branches, transfers, damage, finished goods, record history, deferred charts)
        working-directory: scripts
        run: python e2e_s4.py
      - name: Accessibility (axe)
        working-directory: scripts
        run: python a11y.py
      - name: Performance budgets (LCP, CLS, JS; 4x CPU throttle)
        working-directory: scripts
        run: python perf.py
      - name: API reference is up to date
        run: git diff --exit-code docs/API.md
      - name: Upload screenshots, diffs and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            server.log
          retention-days: 14
