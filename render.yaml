# Render Blueprint — DiziVAT R5 (NestJS + PostgreSQL), branch r5-nestjs.
# Database: Neon (free Postgres that does not expire) — paste its connection string as DATABASE_URL when asked.
# The GitHub Pages demo (main branch) is unaffected.
services:
  - type: web
    name: dizivat-r5
    runtime: docker
    plan: free
    region: ohio             # same AWS region as the Neon database (us-east-2) — every API request talks to it
    branch: r5-nestjs
    # Deploys come from GitHub Actions (.github/workflows/backend.yml → "Deploy → Render") only after the full test
    # suite, the Docker image smoke test and the CI workflow pass for the commit — so no Git auto-deploy here.
    # Quoted: a bare off is YAML false, which the Blueprint schema rejects.
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon → Connect → connection string; prefer the direct host (without "-pooler")
      - key: SESSION_SECRET
        generateValue: true  # shared by the web server (middleware) and the API (sessions)
      - key: NODE_ENV
        value: production
